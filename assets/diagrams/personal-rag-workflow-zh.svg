<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1180" role="img" aria-labelledby="title desc"><title id="title">个人知识到博客 Agent：完整流程</title><desc id="desc">上半部是待实现的知识加工层；当前用九份公开文档进入百炼。下半部展示访客、博客、后端、Agent 与知识库的问答闭环。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2657d8"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8" fill="#2657d8"/></marker></defs><rect width="880" height="1180" rx="16" fill="#f5f5f2"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="26" fill="#202722" font-weight="650">先跑通 Agent，再建设知识加工层</text><text x="32" y="74" font-size="16" fill="#626b64" font-weight="400">已备：本地文档与代码  ·  待完成：云端配置和真实联调</text><rect x="32" y="100" width="816" height="80" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="130" font-size="18" fill="#202722" font-weight="600">原始个人资料｜保持本地</text><text x="50" y="155" font-size="14" fill="#626b64" font-weight="400">简历、项目报告、PDF、代码、Notebook、图片</text><path d="M440 180 L440 215" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="32" y="215" width="816" height="90" rx="12" fill="#eeeee9" stroke="#a9b6b0" stroke-dasharray="6 5"/><text x="50" y="245" font-size="18" fill="#202722" font-weight="600">知识加工层｜TODO，不阻塞首版上线</text><text x="50" y="270" font-size="14" fill="#626b64" font-weight="400">扫描去重 → 分类解析 → 项目归组 → 事实与来源 → 审阅</text><text x="50" y="292" font-size="13" fill="#626b64" font-weight="400">LangGraph：可选编排；知识图谱 / GraphRAG：后续评估</text><path d="M440 305 L440 345" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="32" y="345" width="816" height="75" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="375" font-size="18" fill="#202722" font-weight="600">第二大脑知识层｜目录与首批档案已建</text><text x="50" y="400" font-size="14" fill="#626b64" font-weight="400">职业档案、简历、项目、技术方法、证据与复盘</text><path d="M250 420 L250 460" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M650 420 L650 460" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="32" y="460" width="396" height="85" rx="12" fill="#eaeef6" stroke="#a9b6b0"/><text x="50" y="490" font-size="18" fill="#202722" font-weight="600">公开导出｜先用现有 9 份 MD</text><text x="50" y="515" font-size="14" fill="#626b64" font-weight="400">独立导出器已可用；未来接加工层</text><rect x="452" y="460" width="396" height="85" rx="12" fill="#eeeee9" stroke="#a9b6b0" stroke-dasharray="6 5"/><text x="470" y="490" font-size="18" fill="#202722" font-weight="600">私人导出｜TODO</text><text x="470" y="515" font-size="14" fill="#626b64" font-weight="400">独立权限，不连接公开博客</text><path d="M230 545 L230 595" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="595" width="816" height="80" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="625" font-size="18" fill="#202722" font-weight="600">北京百炼知识库｜待创建与索引</text><text x="50" y="650" font-size="14" fill="#626b64" font-weight="400">上传审阅文档 → 解析 / 索引 → 命中测试</text><text x="32" y="720" font-size="22" fill="#202722" font-weight="650">线上问答闭环｜代码已备，云端待部署</text><rect x="32" y="750" width="396" height="85" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="780" font-size="18" fill="#202722" font-weight="600">访客 + GitHub Pages</text><text x="50" y="805" font-size="14" fill="#626b64" font-weight="400">中英文提问；展示回答与公开引用</text><rect x="452" y="750" width="396" height="85" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="470" y="780" font-size="18" fill="#202722" font-weight="600">函数计算后端｜待部署</text><text x="470" y="805" font-size="14" fill="#626b64" font-weight="400">密钥、请求限制、公开来源校验</text><path d="M428 791 L452 791" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="452" y="900" width="396" height="85" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="470" y="930" font-size="18" fill="#202722" font-weight="600">百炼 Agent｜待配置发布</text><text x="470" y="955" font-size="14" fill="#626b64" font-weight="400">模型 + 提示词 + 知识库</text><path d="M650 835 L650 900" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="666" y="870" font-size="13" fill="#626b64" font-weight="400">HTTPS</text><path d="M848 942 L862 942 L862 636 L848 636" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="32" y="900" width="396" height="85" rx="12" fill="#eaeef6" stroke="#a9b6b0"/><text x="50" y="930" font-size="18" fill="#202722" font-weight="600">验收后，才标记已上线</text><text x="50" y="955" font-size="14" fill="#626b64" font-weight="400">真实问答、引用、双语、超时、限流</text><path d="M230 835 L230 900" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="1050" font-size="18" fill="#202722" font-weight="600">更新闭环：修改资料 → 重新导出 → 更新索引 → 回归测试</text><text x="32" y="1090" font-size="15" fill="#626b64" font-weight="400">实线：首版实施路径；虚线 / TODO：后续模块，不代表已经运行。</text><text x="32" y="1125" font-size="14" fill="#626b64" font-weight="400">知识库和 Agent 尚未云端部署；图中包含计划中的连接。</text></g></svg>