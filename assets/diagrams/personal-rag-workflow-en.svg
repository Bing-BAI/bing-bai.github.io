<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1180" role="img" aria-labelledby="title desc"><title id="title">Personal knowledge to blog Agent: full workflow</title><desc id="desc">The planned ingestion layer is deferred. The current path uses nine public documents. The serving loop connects visitors, the blog, the API, the Agent and its knowledge base.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2657d8"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8" fill="#2657d8"/></marker></defs><rect width="880" height="1180" rx="16" fill="#f5f5f2"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="26" fill="#202722" font-weight="650">Connect the Agent first. Build ingestion next.</text><text x="32" y="74" font-size="16" fill="#626b64" font-weight="400">Ready: local documents and code · Pending: cloud setup and live tests</text><rect x="32" y="100" width="816" height="80" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="130" font-size="18" fill="#202722" font-weight="600">Raw personal materials | local</text><text x="50" y="155" font-size="14" fill="#626b64" font-weight="400">Résumés, project reports, PDFs, code, notebooks and images</text><path d="M440 180 L440 215" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="32" y="215" width="816" height="90" rx="12" fill="#eeeee9" stroke="#a9b6b0" stroke-dasharray="6 5"/><text x="50" y="245" font-size="18" fill="#202722" font-weight="600">Knowledge ingestion | TODO, deferred</text><text x="50" y="270" font-size="14" fill="#626b64" font-weight="400">Scan / deduplicate → parse → group → extract facts / sources → review</text><text x="50" y="292" font-size="13" fill="#626b64" font-weight="400">LangGraph: optional orchestration; knowledge graph / GraphRAG: later</text><path d="M440 305 L440 345" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="32" y="345" width="816" height="75" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="375" font-size="18" fill="#202722" font-weight="600">Second-brain knowledge layer | initial files ready</text><text x="50" y="400" font-size="14" fill="#626b64" font-weight="400">Profile, résumé, projects, methods, evidence and reviews</text><path d="M250 420 L250 460" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M650 420 L650 460" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="32" y="460" width="396" height="85" rx="12" fill="#eaeef6" stroke="#a9b6b0"/><text x="50" y="490" font-size="18" fill="#202722" font-weight="600">Public export | use the existing 9 MD files</text><text x="50" y="515" font-size="14" fill="#626b64" font-weight="400">Exporter ready; future ingestion integration</text><rect x="452" y="460" width="396" height="85" rx="12" fill="#eeeee9" stroke="#a9b6b0" stroke-dasharray="6 5"/><text x="470" y="490" font-size="18" fill="#202722" font-weight="600">Private export | TODO</text><text x="470" y="515" font-size="14" fill="#626b64" font-weight="400">Separate access; never attach to public blog</text><path d="M230 545 L230 595" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="595" width="816" height="80" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="625" font-size="18" fill="#202722" font-weight="600">Beijing knowledge base | setup pending</text><text x="50" y="650" font-size="14" fill="#626b64" font-weight="400">Upload reviewed documents → parse / index → retrieval tests</text><text x="32" y="720" font-size="22" fill="#202722" font-weight="650">Serving loop | code ready, cloud deployment pending</text><rect x="32" y="750" width="396" height="85" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="50" y="780" font-size="18" fill="#202722" font-weight="600">Visitor + GitHub Pages</text><text x="50" y="805" font-size="14" fill="#626b64" font-weight="400">Ask in either language; display answers / sources</text><rect x="452" y="750" width="396" height="85" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="470" y="780" font-size="18" fill="#202722" font-weight="600">Function Compute API | pending</text><text x="470" y="805" font-size="14" fill="#626b64" font-weight="400">Secrets, request limits, source validation</text><path d="M428 791 L452 791" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="452" y="900" width="396" height="85" rx="12" fill="#fafbf8" stroke="#a9b6b0"/><text x="470" y="930" font-size="18" fill="#202722" font-weight="600">Bailian Agent | pending</text><text x="470" y="955" font-size="14" fill="#626b64" font-weight="400">Model + prompt + knowledge base</text><path d="M650 835 L650 900" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="666" y="870" font-size="13" fill="#626b64" font-weight="400">HTTPS</text><path d="M848 942 L862 942 L862 636 L848 636" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="32" y="900" width="396" height="85" rx="12" fill="#eaeef6" stroke="#a9b6b0"/><text x="50" y="930" font-size="18" fill="#202722" font-weight="600">Mark live only after acceptance</text><text x="50" y="955" font-size="14" fill="#626b64" font-weight="400">Real answers, sources, languages, timeouts, limits</text><path d="M230 835 L230 900" fill="none" stroke="#2657d8" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="1050" font-size="18" fill="#202722" font-weight="600">Update loop: edit → export → reindex → regression tests</text><text x="32" y="1090" font-size="15" fill="#626b64" font-weight="400">Solid: MVP implementation path. Dashed / TODO: future work, not running.</text><text x="32" y="1125" font-size="14" fill="#626b64" font-weight="400">Cloud knowledge base and Agent are not deployed; connections include planned work.</text></g></svg>